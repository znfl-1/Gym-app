name: Extract Gym App

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract app
        run: |
          mkdir -p extracted
          unzip -o gym-app-pwa.zip -d extracted
          cp -r extracted/. .
          rm -rf extracted
          rm -f gym-app-pwa.zip

      - name: Commit app files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Add Gym App source files"
          git push
